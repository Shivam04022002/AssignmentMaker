// HandWrite native exporter (Android library, autolinked).
apply plugin: 'com.android.library'

def builtInKotlin = providers.gradleProperty("android.builtInKotlin").orNull
if (com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger() <= 8 ||
        builtInKotlin == null || !builtInKotlin.toBoolean()) {
    apply plugin: 'kotlin-android'
}

def ext(name, fallback) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
    namespace "com.handwrite.export"
    compileSdkVersion ext('compileSdkVersion', 36)

    defaultConfig {
        minSdkVersion ext('minSdkVersion', 24)
        targetSdkVersion ext('targetSdkVersion', 36)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "com.facebook.react:react-android"
    // FileProvider (already part of every React Native app's dependencies).
    implementation "androidx.core:core:1.13.1"
}
